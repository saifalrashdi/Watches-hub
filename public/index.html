<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watches Hub — Buy &amp; Sell Rare Watches</title>
  <meta name="description" content="Watches Hub — the marketplace for rare watches. Post your watch, receive offers, chat with buyers and sellers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/wh-logo.png">
</head>
<body>

  <header class="site-header" id="siteHeader">
    <a class="wordmark" href="#/">
      <img src="/images/wh-logo.png" alt="Watches Hub" class="brand-logo">
      <span class="wordmark-org">Watches</span> <span class="wordmark-lux" data-i18n="brand.hub">Hub</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="#/" data-i18n="nav.home">Home</a>
      <a href="#/browse" data-i18n="nav.browse">Browse</a>
      <a href="#/sell" data-i18n="nav.sell">Sell</a>
      <a href="#/about" data-i18n="nav.about">About</a>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">عربي</button>
      <span id="authArea"></span>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="/images/wh-logo.png" alt="Watches Hub" class="brand-logo brand-logo-lg">
        <span class="wordmark-org">Watches</span> <span class="wordmark-lux" data-i18n="brand.hub">Hub</span>
        <p class="footer-tag" data-i18n="footer.tag">The marketplace for rare watches — post, negotiate, deal.</p>
      </div>
      <div class="footer-links">
        <a href="#/" data-i18n="nav.home">Home</a>
        <a href="#/browse" data-i18n="nav.browse">Browse</a>
        <a href="#/sell" data-i18n="nav.sell">Sell</a>
        <a href="#/about" data-i18n="nav.about">About</a>
        <a href="#/admin" data-i18n="nav.admin">Admin</a>
      </div>
      <div class="footer-contact">
        <p class="footer-note" data-i18n="footer.note">Every deal is between the buyer and the seller — we just make the introduction.</p>
      </div>
    </div>
    <div class="footer-base"><span data-i18n="footer.rights">© Watches Hub. Deal safely: inspect before you pay.</span></div>
  </footer>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="/js/app.js" defer></script>
  <script src="/js/admin.js" defer></script>
  <script src="/js/chatbot.js" defer></script>
</body>
</html>
